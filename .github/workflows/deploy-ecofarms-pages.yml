name: Deploy Ecofarms website and Farmers Connect to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ecofarms-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: farmers-connect/package.json

      - name: Build Farmers Connect
        working-directory: farmers-connect
        run: |
          npm install --no-audit --no-fund
          npm run build -- --base=/Eco-farms-Limited/farmers-connect/ --outDir ../_site/farmers-connect

      - name: Assemble public site
        run: |
          mkdir -p _site
          cp index.html app.js styles.css legal.css management.html privacy.html terms.html robots.txt site.webmanifest sitemap.xml _site/
          cp -R assets _site/assets

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
